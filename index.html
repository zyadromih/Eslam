<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الموسوعة الإسلامية الشاملة PRO</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Amiri:wght@700&display=swap"

        <button onclick="show('quran')">الآيات</button>
        <button onclick="show('fatwa')">الفتاوى</button>

    <div class="container">
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="🔎 بحث شامل..." onkeyup="searchAll()">
        </div>

        <!-- هنا يبقى محتوى الأقسام هيتقسم في ملف ثاني -->
        <div id="sections"></div>

    <footer>تصميم إسلامي احترافي متكامل 🚀</footer>
